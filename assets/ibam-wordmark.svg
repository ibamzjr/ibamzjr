<svg xmlns="http://www.w3.org/2000/svg" width="980" height="760" viewBox="0 0 980 760" role="img" aria-labelledby="wordmark-title wordmark-desc">
  <title id="wordmark-title">IBAM animated ASCII wordmark</title>
  <desc id="wordmark-desc">A dimensional IBAM wordmark followed by Ilham Romadhon's developer profile.</desc>
  <defs>
    <clipPath id="wordmark-wipe">
      <rect class="wordmark-wipe" x="120" y="120" width="0" height="360"><animate attributeName="width" from="0" to="760" begin="0.2s" dur="1.25s" fill="freeze" /></rect>
    </clipPath>
    <linearGradient id="info-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF" />
      <stop offset="0.52" stop-color="#F2CC60" />
      <stop offset="1" stop-color="#FF7B72" />
    </linearGradient>
  </defs>
  <style>
    .terminal-text {
      fill: #8B949E;
      font: 16px 'Cascadia Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
    }
    .mark {
      font: 34px 'Cascadia Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      white-space: pre;
    }
    .mark-shadow-far { fill: #8C6D1F; opacity: 0.42; }
    .mark-shadow-near { fill: #1F6FEB; opacity: 0.7; }
    .mark-front { fill: #E6EDF3; }
    .wordmark-shell {
      transform-box: fill-box;
      transform-origin: center;
      animation: wordmark-rock 5.2s ease-in-out 1.8s infinite;
    }
    .identity {
      fill: #E6EDF3;
      font: 700 22px 'Cascadia Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      letter-spacing: 0;
    }
    .info-line {
      opacity: 0; transform: translateX(-12px); animation: info-enter 0.45s ease-out forwards;
    }
    .delay-1 { animation-delay: 1.65s; }
    .delay-2 { animation-delay: 1.82s; }
    .delay-3 { animation-delay: 1.99s; }
    .delay-4 { animation-delay: 2.16s; }
    .delay-5 { animation-delay: 2.33s; }
    .info-key {
      fill: #58A6FF;
      font: 16px 'Cascadia Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
    }
    .info-value {
      fill: #C9D1D9;
      font: 16px 'Cascadia Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
    }
    @keyframes info-enter { to { opacity: 1; transform: translateX(0); } }
    @keyframes wordmark-rock {
      0%, 100% { transform: translateX(0) skewY(0deg); }
      25% { transform: translateX(4px) skewY(-0.7deg); }
      75% { transform: translateX(-4px) skewY(0.7deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .wordmark-wipe { width: 760px !important; }
      .wordmark-shell, .info-line { animation: none !important; opacity: 1; transform: none; }
    }
  </style>
  <rect x="1" y="1" width="978" height="758" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="2" />
  <path d="M1 64 H979" stroke="#30363D" />
  <circle cx="28" cy="32" r="10" fill="#FF7B72" />
  <circle cx="58" cy="32" r="10" fill="#F2CC60" />
  <circle cx="88" cy="32" r="10" fill="#3FB950" />
  <text class="terminal-text" x="318" y="39">ibam@github: ~ $ ./wordmark.sh --3d</text>
  <g class="wordmark-shell" clip-path="url(#wordmark-wipe)">
    <text class="mark mark-shadow-far" x="204" y="208" textLength="600" lengthAdjust="spacingAndGlyphs">@@@@@  @@@@    @@@   @   @</text><text class="mark mark-shadow-far" x="204" y="247" textLength="600" lengthAdjust="spacingAndGlyphs">  @    @   @  @   @  @@ @@</text><text class="mark mark-shadow-far" x="204" y="286" textLength="600" lengthAdjust="spacingAndGlyphs">  @    @   @  @   @  @ @ @</text><text class="mark mark-shadow-far" x="204" y="325" textLength="600" lengthAdjust="spacingAndGlyphs">  @    @@@@   @@@@@  @ @ @</text><text class="mark mark-shadow-far" x="204" y="364" textLength="600" lengthAdjust="spacingAndGlyphs">  @    @   @  @   @  @   @</text><text class="mark mark-shadow-far" x="204" y="403" textLength="600" lengthAdjust="spacingAndGlyphs">  @    @   @  @   @  @   @</text><text class="mark mark-shadow-far" x="204" y="442" textLength="600" lengthAdjust="spacingAndGlyphs">@@@@@  @@@@   @   @  @   @</text>
    <text class="mark mark-shadow-near" x="197" y="202" textLength="600" lengthAdjust="spacingAndGlyphs">@@@@@  @@@@    @@@   @   @</text><text class="mark mark-shadow-near" x="197" y="241" textLength="600" lengthAdjust="spacingAndGlyphs">  @    @   @  @   @  @@ @@</text><text class="mark mark-shadow-near" x="197" y="280" textLength="600" lengthAdjust="spacingAndGlyphs">  @    @   @  @   @  @ @ @</text><text class="mark mark-shadow-near" x="197" y="319" textLength="600" lengthAdjust="spacingAndGlyphs">  @    @@@@   @@@@@  @ @ @</text><text class="mark mark-shadow-near" x="197" y="358" textLength="600" lengthAdjust="spacingAndGlyphs">  @    @   @  @   @  @   @</text><text class="mark mark-shadow-near" x="197" y="397" textLength="600" lengthAdjust="spacingAndGlyphs">  @    @   @  @   @  @   @</text><text class="mark mark-shadow-near" x="197" y="436" textLength="600" lengthAdjust="spacingAndGlyphs">@@@@@  @@@@   @   @  @   @</text>
    <text class="mark mark-front" x="190" y="196" textLength="600" lengthAdjust="spacingAndGlyphs">@@@@@  @@@@    @@@   @   @</text><text class="mark mark-front" x="190" y="235" textLength="600" lengthAdjust="spacingAndGlyphs">  @    @   @  @   @  @@ @@</text><text class="mark mark-front" x="190" y="274" textLength="600" lengthAdjust="spacingAndGlyphs">  @    @   @  @   @  @ @ @</text><text class="mark mark-front" x="190" y="313" textLength="600" lengthAdjust="spacingAndGlyphs">  @    @@@@   @@@@@  @ @ @</text><text class="mark mark-front" x="190" y="352" textLength="600" lengthAdjust="spacingAndGlyphs">  @    @   @  @   @  @   @</text><text class="mark mark-front" x="190" y="391" textLength="600" lengthAdjust="spacingAndGlyphs">  @    @   @  @   @  @   @</text><text class="mark mark-front" x="190" y="430" textLength="600" lengthAdjust="spacingAndGlyphs">@@@@@  @@@@   @   @  @   @</text>
  </g>
  <rect x="90" y="488" width="800" height="2" fill="url(#info-rule)" opacity="0.8" />
  <text class="identity" x="90" y="532">ILHAM ROMADHON</text>
  <g class="info-line delay-1"><text class="info-key" x="90" y="574">role</text><text class="info-value" x="230" y="574">Web Developer</text></g>
  <g class="info-line delay-2"><text class="info-key" x="90" y="610">base</text><text class="info-value" x="230" y="610">Malang, Indonesia</text></g>
  <g class="info-line delay-3"><text class="info-key" x="90" y="646">stack</text><text class="info-value" x="230" y="646">Laravel / React / Inertia.js</text></g>
  <g class="info-line delay-4"><text class="info-key" x="90" y="682">build</text><text class="info-value" x="230" y="682">RoyalVilla</text></g>
  <g class="info-line delay-5"><text class="info-key" x="90" y="718">study</text><text class="info-value" x="230" y="718">BINUS University</text></g>
</svg>
